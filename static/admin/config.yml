backend:
  name: turbo-github
  turbo_site_id: TEMP_SITE_ID
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "标题"
        name: "title"
        widget: "string"

      - label: "发布日期"
        name: "date"
        widget: "datetime"

      - label: "草稿"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "分类"
        name: "categories"
        widget: "list"
        required: false

      - label: "标签"
        name: "tags"
        widget: "list"
        required: false

      - label: "正文"
        name: "body"
        widget: "markdown"
