baseURL = "https://lelouchvi0416.github.io/"
locale = "zh-cn"
title = "Lelouch VI"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "Lelouch VI"
description = "记录技术、学习、项目与思考"
author = "lelouchvi0416"

defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true

comments = false

[params.homeInfoParams]
Title = "你好，我是 Lelouch"
Content = """
这里记录我的技术学习、项目实践与个人思考。

主要内容包括 STM32、FPGA、自动控制、数学、编程以及学习记录。
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/lelouchvi0416"

