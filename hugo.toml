baseURL = "https://lelouchvi0416.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
title = "Lelouch VI"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

[params]
mainSections = ["posts"]
DateFormat = "2006.01.02"
ShowPageNums = true
env = "production"
title = "Lelouch VI"
description = "记录技术、学习、项目与思考"
author = "lelouchvi0416"

defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true

comments = false

[params.homeInfoParams]
Title = "Lelouch VI"
Content = """
记录技术、学习、项目与思考。

主要关注 STM32、FPGA、自动控制、数学、编程，以及一些长期值得记录的内容。
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/lelouchvi0416"

[[params.socialIcons]]
name = "rss"
url = "/index.xml"

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "projects"
name = "项目"
url = "/projects/"
weight = 20

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 30

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 40

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 50

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 60

[[menu.main]]
identifier = "about"
name = "关于我"
url = "/about/"
weight = 70

[outputs]
home = ["HTML", "RSS", "JSON"]
[params.assets]
favicon = "/favicon.svg"
theme_color = "#207b61"

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 4
